name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Mettre en place le cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests du moteur de planification
        run: ./gradlew testDebugUnitTest

      - name: Construire l'APK
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: badgeuse-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier le rapport de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/
          # Un échec survenu avant l'exécution des tests ne produit aucun rapport :
          # ce n'est pas une raison de faire échouer l'étape de publication.
          if-no-files-found: ignore
